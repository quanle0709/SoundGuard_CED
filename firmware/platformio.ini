[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library@^1.12.1
    adafruit/Adafruit SSD1306@^2.5.15
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0

build_flags =
    -D HUD_OLED_WIDTH=64
    -D HUD_OLED_HEIGHT=32
    -D HUD_OLED_ADDRESS=0x3C
    -D HUD_OLED_SDA=21
    -D HUD_OLED_SCL=22
    -D HUD_ROTATION=0

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library@^1.12.1
    adafruit/Adafruit SSD1306@^2.5.15
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0

build_flags =
    -D HUD_OLED_WIDTH=64
    -D HUD_OLED_HEIGHT=32
    -D HUD_OLED_ADDRESS=0x3C
    -D HUD_OLED_SDA=4
    -D HUD_OLED_SCL=5
    -D HUD_ROTATION=0
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
